spring.session.store-type=none
spring.cache.type=simple
spring.datasource.hikari.maximum-pool-size=10
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true
spring.flyway.enabled=true
spring.flyway.table=schema_version
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
logging.level.root=WARN
logging.level.org.hibernate.orm.incubating=ERROR
logging.level.org.hibernate.envers.configuration.internal.metadata=WARN
logging.level.fi.vm.sade.eperusteet.ylops.service.util.impl.JulkaisuServiceImpl=DEBUG
